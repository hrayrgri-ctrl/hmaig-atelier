# Garde la base gratuite Supabase active (elle se met en pause après 7 jours sans activité).
# Envoie un simple « ping » public tous les 3 jours. Aucune donnée n'est lue ni modifiée.
name: keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -fsS --retry 3 -X POST "https://hwwjwifqkpguwqzmktaa.supabase.co/rest/v1/rpc/ping" \
            -H "apikey: sb_publishable_JIYngpjIUBWzYZJzJKmlQQ_-CT7VWjV" \
            -H "Content-Type: application/json" -d '{}'
      # GitHub désactive les tâches planifiées d'un dépôt public sans activité depuis 60 jours :
      # une fois par mois, on enregistre donc un petit commit vide.
      - uses: actions/checkout@v4
        if: ${{ github.event_name == 'schedule' && github.run_number % 10 == 0 }}
      - name: Activité mensuelle
        if: ${{ github.event_name == 'schedule' && github.run_number % 10 == 0 }}
        run: |
          git config user.name "keepalive"
          git config user.email "keepalive@users.noreply.github.com"
          git commit --allow-empty -m "keepalive: activité mensuelle"
          git push
