a{color:var(--blue-x)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.amount,.date,.mono,.stat-number,.mini-price,.num{font-variant-numeric:tabular-nums}
.mono{letter-spacing:.01em}

/* ---------- Structure ---------- */
.app{min-height:100vh;display:grid;grid-template-columns:236px minmax(0,1fr)}
.side{background:var(--rail);color:#e7eaec;padding:22px 14px 18px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;overflow:auto}
.brand{display:flex;gap:12px;align-items:center;padding:2px 8px}
.brand-mark{width:44px;height:41px;flex:none;background:var(--amber);-webkit-mask:var(--logo-mark) center/contain no-repeat;mask:var(--logo-mark) center/contain no-repeat}
.brand h1{font:800 17px/1.1 var(--disp);letter-spacing:-.03em;margin:0;color:#fff}
.brand small{display:block;color:#8e979c;font-size:12px;margin-top:4px}
.nav{display:grid;gap:3px}
.nav button{color:#a4acb0;background:transparent;text-align:left;padding:10px 12px;border-radius:10px;display:flex;gap:12px;align-items:center;position:relative;font-weight:600;transition:background .15s,color .15s}
.nav button:hover{background:#16181a;color:#fff}
.nav button.active{background:#1d2022;color:#fff}
.nav button.active:before{content:'';position:absolute;left:-14px;top:9px;bottom:9px;width:4px;border-radius:0 4px 4px 0;background:var(--amber)}
.nav button.active i{color:var(--amber)}
.nav i{width:20px;font-style:normal;display:grid;place-items:center;flex:none}
.nav i svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.sdot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#6b7479;flex:none;display:inline-block;font-style:normal}
.sdot.green{background:#3fb27f}.sdot.amber{background:var(--amber)}.sdot.red{background:#e5604d}.sdot.grey{background:#6b7479}
.syncstat{display:flex;align-items:center;gap:10px;font-weight:600;padding:10px 12px;border-radius:10px;background:var(--soft);border:1px solid var(--line)}
.syncstat .sdot{margin-left:0}
.badge{margin-left:auto;background:var(--amber);color:var(--ink);font:700 11px var(--font);font-style:normal;border-radius:20px;padding:2px 8px}
.side-note{margin-top:auto;background:#131516;border:1px solid #24282b;border-radius:14px;padding:14px;color:#98a1a6;font-size:12px;line-height:1.55}
.side-note strong{display:block;color:#fff;font:700 13px var(--disp);margin-bottom:5px}
.main{padding:28px 3.6vw 56px;max-width:1480px;width:100%;margin:auto}
.topbar{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.eyebrow{font-size:13px;color:var(--muted);margin:0 0 5px;font-weight:600;font-variant-numeric:tabular-nums}
.topbar h2{font:800 32px/1.05 var(--disp);letter-spacing:-.04em;margin:0}
.top-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.demo-pill{border:1px solid #f0d58c;background:var(--amber-t);border-radius:30px;padding:8px 13px;font-size:12px;font-weight:600;color:var(--amber-x);display:inline-block}
button.demo-pill:hover{background:#ffe7a8}
.gsearch{position:relative}
.gsearch input{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 13px;width:270px;outline:none}
.gres{display:none;position:absolute;right:0;top:46px;width:min(420px,92vw);background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 14px 40px rgba(11,12,13,.16);z-index:8;max-height:60vh;overflow:auto}
.gres.open{display:block}
.gres .gh{font-size:12px;font-weight:700;color:var(--muted);padding:10px 14px 4px}
.gres .gi{display:block;width:100%;text-align:left;background:transparent;padding:9px 14px;font-size:13px}
.gres .gi:hover{background:var(--soft)}
.gres .gi small{display:block;color:var(--muted);margin-top:2px;font-size:12px}

/* ---------- Boutons & champs ---------- */
.primary{background:var(--amber);color:var(--ink);border-radius:9px;padding:11px 16px;font-weight:700;transition:background .15s}
.primary:hover{background:var(--amber-hi)}
.secondary{background:#fff;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 14px;font-weight:600;transition:border-color .15s,background .15s}
.secondary:hover{border-color:#a7afb3;background:var(--soft)}
button.danger{background:#fff;color:var(--red-x);border:1px solid #f0c3c0;border-radius:9px;padding:9px 14px;font-weight:600}
button.danger:hover{background:var(--red-t)}
.small{padding:7px 11px;font-size:12.5px}
.ghost{background:transparent;color:#fff;border:1px solid #3a4044;border-radius:9px;padding:11px 16px;font-weight:600;transition:background .15s,border-color .15s}
.ghost:hover{background:#1a1d1f;border-color:#59616a}
.icon-btn{background:transparent;color:#7b868b;padding:5px 8px;border-radius:6px;font-size:15px}
.icon-btn:hover{color:var(--ink);background:var(--soft)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(242,164,0,.35);outline:none}
.search{flex:1;min-width:180px;position:relative}
.search input,.filters select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 12px;outline:none;width:100%}
.filters{padding:0 20px 16px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filters select{max-width:190px}
.seg{display:flex;gap:3px;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{background:transparent;padding:6px 12px;border-radius:7px;font-weight:600;font-size:12.5px;color:var(--muted)}
.seg button.on{background:var(--ink);color:#fff}

/* ---------- Bandeau d'accueil ---------- */
.hero{position:relative;overflow:hidden;background:var(--rail);color:#fff;border-radius:20px;padding:32px 36px 0;margin-bottom:18px}
.hero-main{max-width:calc(100% - 300px);position:relative;z-index:1}
.hero h3{font:800 clamp(34px,4.6vw,54px)/1 var(--disp);letter-spacing:-.042em;margin:0 0 14px}
.hero .brief{font-size:16px;line-height:1.5;color:#c3c9cc;max-width:44ch;margin:0 0 22px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap}
.hero-logo{position:absolute;right:38px;top:30px;width:226px;height:304px;background:#fff;-webkit-mask:var(--logo-full) right top/contain no-repeat;mask:var(--logo-full) right top/contain no-repeat}
.hero-kpis{display:grid;grid-template-columns:repeat(4,1fr);margin:30px 300px 0 -36px;border-top:1px solid #23272a;position:relative;z-index:1}
.hk{background:transparent;color:#fff;text-align:left;padding:16px 22px 18px 36px;border-right:1px solid #23272a;transition:background .15s}
.hk:last-child{border-right:0}
.hk:hover{background:#141618}
.hk .l{display:block;font-size:13px;color:#98a1a6;font-weight:600}
.hk .stat-number{font:800 34px/1 var(--disp);letter-spacing:-.04em;margin:8px 0 6px}
.hk .stat-note{font-size:12.5px;color:#8e979c;margin:0}
.hk .stat-number.hot{color:var(--amber)}
.hk .stat-number,.hk .stat-note{display:block}
.hk .bad{color:#ff8a82;font-weight:700}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:18px}
.kp{padding:16px 20px;border-right:1px solid var(--line)}
.kp:last-child{border-right:0}
.kp .l{display:block;font-size:13px;color:var(--muted);font-weight:600}
.kp .stat-number{font:800 25px/1 var(--disp);letter-spacing:-.035em;margin:8px 0 5px}
.kp .stat-note{font-size:12.5px;color:var(--muted)}
.kp.click{cursor:pointer}.kp.click:hover{background:var(--soft)}
.up{color:var(--green)}.orange{color:#b87400}.redt{color:var(--red)}
.content{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(290px,.8fr);gap:18px}
.stack{display:grid;gap:18px;align-content:start;min-width:0}

/* ---------- Panneaux & tableaux ---------- */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-head{padding:19px 20px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px}
.panel h3{margin:0;font:800 17px/1.2 var(--disp);letter-spacing:-.025em}
.panel-sub{font-size:12.5px;color:var(--muted);margin-top:3px}
.pad{padding:0 20px 20px}
.table-wrap{overflow:auto}
.table{width:100%;border-collapse:collapse;font-size:13px}
.table th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;background:var(--soft);padding:10px 20px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);white-space:nowrap}
.table td{padding:13px 20px;border-bottom:1px solid #eceeef;vertical-align:middle}
.table tr:last-child td{border-bottom:0}
.table tr.click{cursor:pointer}.table tr.click:hover td{background:#f8f9f9}
.table td.nw{white-space:nowrap}
.right{text-align:right}
.client{font-weight:700}
.device{font-size:12px;color:var(--muted);margin-top:2px}
.muted{color:var(--muted);font-size:12.5px}
.late{font-size:12px;color:var(--red);font-weight:700;margin-top:3px}
.rowhd{display:flex;gap:12px;align-items:center}
.dtile{width:36px;height:36px;border-radius:9px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:#4a5358}
.dtile svg,.di{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.tag{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:600;white-space:nowrap}
.tag:before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.tag.orange{background:var(--amber-t);color:var(--amber-x)}.tag.blue{background:var(--blue-t);color:var(--blue-x)}.tag.green{background:var(--green-t);color:var(--green-x)}.tag.grey{background:#eceeef;color:#5b666b}.tag.red{background:var(--red-t);color:var(--red-x)}
.amount{font-size:13px;white-space:nowrap;font-weight:600}
.date{font-size:12.5px;color:#4f5a5f;white-space:nowrap}
.empty{padding:40px;text-align:center;color:var(--muted);display:none}
.empty:before{content:'';display:block;width:60px;height:54px;margin:0 auto 14px;background:var(--line);-webkit-mask:var(--logo-mark) center/contain no-repeat;mask:var(--logo-mark) center/contain no-repeat}
.empty .primary{margin-top:14px}

/* ---------- Étiquettes de dépôt ---------- */
.bench{display:grid;grid-template-columns:repeat(auto-fill,minmax(262px,1fr));gap:12px;padding:0 20px 20px}
.tagc{display:grid;grid-template-columns:56px minmax(0,1fr);text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden;transition:border-color .15s,transform .15s}
.tagc:hover{border-color:var(--ink);transform:translateY(-2px)}
.tagc .stub{display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:10px;padding:11px 0 12px;background:var(--soft);border-right:2px dashed #c3c9cd;color:#4a5358}
.tagc .hole{width:11px;height:11px;border-radius:50%;background:var(--paper);box-shadow:inset 0 1px 2px rgba(11,12,13,.28)}
.tagc .stub b{writing-mode:vertical-rl;transform:rotate(180deg);font:700 12px var(--font);letter-spacing:.14em;font-variant-numeric:tabular-nums}
.tagc.soon .stub{background:var(--amber-t);color:var(--amber-x);border-right-color:#e8c368}
.tagc.late .stub{background:var(--red-t);color:var(--red-x);border-right-color:#ee9d98}
.tagc.late{border-color:#ee9d98}
.tb{display:flex;flex-direction:column;gap:3px;padding:12px 14px 12px;min-width:0}
.tb .m{font:800 16px/1.2 var(--disp);letter-spacing:-.02em}
.tb .c{font-size:12.5px;color:var(--muted)}
.tb .i{font-size:13px;margin:5px 0 8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tb .f{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;flex-wrap:wrap}
.tb .due{font-size:12.5px;font-weight:600;color:var(--muted)}
.tagc.late .due{color:var(--red)}.tagc.soon .due{color:var(--amber-x)}

/* ---------- Graphiques ---------- */
.bars{display:grid;gap:10px}
.bar{display:grid;grid-template-columns:118px 1fr 26px;align-items:center;gap:10px;font-size:12.5px}
.bar .bt{height:8px;background:var(--soft);border-radius:8px;overflow:hidden}
.bar .bt i{display:block;height:100%;background:var(--ink);border-radius:8px}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:10px;height:128px;padding-top:8px}
.col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--muted)}
.col i{width:100%;max-width:44px;background:#c7ccd0;border-radius:6px 6px 0 0;min-height:3px;display:block}
.col:last-child i{background:var(--amber)}
.col b{font:600 11px var(--font);color:var(--ink);font-variant-numeric:tabular-nums}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}

/* ---------- Carte garantie, notifications ---------- */
.aside-card{padding:20px}
.warranty{background:var(--rail);color:#fff;position:relative;overflow:hidden;border-color:var(--rail)}
.warranty:after{content:attr(data-n);position:absolute;right:-6px;bottom:-30px;font:800 120px/1 var(--disp);letter-spacing:-.06em;color:#1a1d1f}
.warranty .eyebrow{color:var(--amber);margin:0}
.warranty h3{font:800 22px/1.12 var(--disp);letter-spacing:-.035em;max-width:200px;margin:10px 0 12px}
.warranty p{color:#a4acb0;line-height:1.55;font-size:12.5px;max-width:240px;position:relative;z-index:1;margin:0}
.mini-list{display:grid;gap:14px}
.mini-item{display:flex;align-items:center;gap:11px;cursor:pointer}
.avatar{width:34px;height:34px;border-radius:9px;background:var(--soft);border:1px solid var(--line);display:grid;place-items:center;flex:none;color:#4a5358}
.mini-item b{display:block;font-size:13px}.mini-item span{font-size:12px;color:var(--muted)}
.mini-price{margin-left:auto;font-size:12.5px;font-weight:600}
.al{display:flex;gap:11px;align-items:flex-start;padding:13px 0;border-top:1px solid #eceeef}
.al:first-child{border-top:0}
.al .ic{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;flex:none;font-weight:800}
.al.danger .ic{background:var(--red-t);color:var(--red-x)}.al.warn .ic{background:var(--amber-t);color:var(--amber-x)}.al.ok .ic{background:var(--green-t);color:var(--green-x)}.al.info .ic{background:var(--blue-t);color:var(--blue-x)}
.al .tx{flex:1;min-width:0}.al .tx b{display:block;font-size:13.5px}.al .tx span{font-size:12.5px;color:var(--muted)}
.al .ac{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}

/* ---------- Fenêtres ---------- */
.modal-back{display:none;position:fixed;inset:0;background:rgba(11,12,13,.66);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:10;padding:20px;align-items:center;justify-content:center}
.modal-back.open{display:flex}
.modal{width:min(860px,100%);max-height:94vh;overflow:auto;background:var(--panel);border-radius:18px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.4);animation:pop .16s ease-out}
.modal.narrow{width:min(620px,100%)}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
.modal-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:18px}
.modal h2{margin:0;font:800 24px/1.15 var(--disp);letter-spacing:-.04em}
.close{background:var(--soft);border:1px solid var(--line);border-radius:8px;width:32px;height:32px;font-size:18px;color:var(--muted);flex:none}
.close:hover{color:var(--ink);border-color:#a7afb3}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field{display:grid;gap:6px;align-content:start}
.field.full{grid-column:1/-1}
.field label{font-size:12.5px;font-weight:600;color:#4a5358}
.field input,.field select,.field textarea,.tbl-in input,.inline-in input,.inline-in select{width:100%;border:1px solid var(--line);background:#fff;border-radius:8px;padding:10px 12px;outline:none}
.field textarea{min-height:64px;resize:vertical}
.form-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px;flex-wrap:wrap}
.notice{font-size:12.5px;color:#4a5358;background:var(--soft);border:1px solid var(--line);padding:9px 11px;border-radius:8px;margin-top:5px}
.notice.warn{background:var(--amber-t);border-color:#f0d58c;color:var(--amber-x)}
.sec{margin-top:24px}
.sec h4{margin:0 0 10px;font:800 14px var(--disp);letter-spacing:-.02em}
.stepper{display:flex;gap:6px;margin-bottom:14px}
.step{flex:1;text-align:center;font-size:12px;color:#8a949a;font-weight:600}
.step b{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#eceeef;color:#6a7378;margin:0 auto 6px;font-size:12px}
.step.done b{background:var(--ink);color:#fff}
.step.cur b{background:var(--amber);color:var(--ink);box-shadow:0 0 0 4px rgba(242,164,0,.28)}
.step.cur{color:var(--ink)}
.status-bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:18px;padding:12px;background:var(--soft);border:1px solid var(--line);border-radius:12px}
.status-bar select{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 11px;min-width:170px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eceeef;font-size:13px}
.row:last-child{border-bottom:0}
.row.click{cursor:pointer}.row.click:hover{background:#f8f9f9}
.chk{display:flex;gap:9px;align-items:center;padding:6px 0;font-size:13px}
.chk input{width:17px;height:17px;accent-color:var(--ink)}
.inline-in{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.inline-in input{flex:1;min-width:120px}.inline-in select{flex:2;min-width:160px}.inline-in input.q{flex:0 0 70px;min-width:70px}
.tl{list-style:none;margin:0;padding:0;font-size:13px}
.tl li{padding:7px 0 7px 16px;border-left:2px solid var(--line);position:relative}
.tl li:before{content:'';position:absolute;left:-5px;top:13px;width:8px;height:8px;border-radius:50%;background:var(--ink)}
.tl li:first-child:before{background:var(--amber);box-shadow:0 0 0 3px rgba(242,164,0,.25)}
.tl b{font-size:12px;color:var(--muted);margin-right:8px;font-variant-numeric:tabular-nums;font-weight:600}
.dev-card{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--soft)}
.tbl-in{width:100%;border-collapse:collapse;font-size:13px}
.tbl-in th{font-size:12px;font-weight:600;color:var(--muted);text-align:left;padding:6px}
.tbl-in td{padding:4px 5px;vertical-align:middle}
.tbl-in .w60{width:70px}.tbl-in .w90{width:105px}
.totals{margin:14px 0 0 auto;max-width:280px;font-size:14px}
.totals div{display:flex;justify-content:space-between;padding:4px 0;font-variant-numeric:tabular-nums}
.totals .big{border-top:2px solid var(--ink);margin-top:5px;padding-top:8px;font:800 17px var(--disp);letter-spacing:-.02em}

/* ---------- Documents imprimables ---------- */
.doc{background:#fff;color:#111;padding:28px;font:13px/1.45 Arial,Helvetica,sans-serif;border:1px solid var(--line);border-radius:6px}
.doc-head{display:flex;justify-content:space-between;gap:20px;margin-bottom:22px}
.doc-brand{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.doc-logo{width:52px;height:auto;display:block}
.doc-co{font-size:21px;font-weight:800;letter-spacing:.01em}
.doc-sm{font-size:11.5px;color:#444;line-height:1.5}
.doc-ti{text-align:right}.doc-ti h1{margin:0 0 6px;font-size:26px;letter-spacing:.06em}
.doc-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:18px}
.doc-grid>div{border:1px solid #ccc;border-radius:6px;padding:10px 12px;font-size:12px}
.doc-tab{width:100%;border-collapse:collapse;font-size:12px}
.doc-tab th{background:#f0f0f0;text-align:left;padding:8px;border:1px solid #ccc}
.doc-tab td{padding:8px;border:1px solid #ddd}
.doc-tab th:not(:first-child),.doc-tab td:not(:first-child){text-align:right;white-space:nowrap}
.doc-tot{margin:12px 0 0 auto;max-width:260px;font-size:13px}
.doc-tot div{display:flex;justify-content:space-between;padding:3px 0}
.doc-tot .big{border-top:2px solid #111;margin-top:4px;padding-top:6px;font-weight:800;font-size:15px}
.doc-sign{margin-top:26px;border:1px dashed #999;border-radius:6px;padding:12px;height:90px;font-size:12px;color:#444}
.doc-foot{margin-top:22px;font-size:10.5px;color:#555;border-top:1px solid #ddd;padding-top:10px}
.toast{position:fixed;right:22px;bottom:22px;background:var(--ink);color:#fff;border-left:4px solid var(--amber);padding:13px 16px;border-radius:9px;box-shadow:0 14px 40px rgba(11,12,13,.3);font-size:13px;display:none;z-index:30;max-width:min(420px,90vw)}
.toast.show{display:block;animation:fade 3.6s both}
@keyframes fade{0%,80%{opacity:1}100%{opacity:0}}
#printArea{display:none}
@media print{
 body{background:#fff}
 .app,.modal-back,.toast,.adm-back{display:none!important}
 #printArea{display:block}
 #printArea .doc{border:0;padding:0}
 @page{margin:14mm}
}

/* ---------- Espace client (atelier) ---------- */
a.secondary{text-decoration:none;display:inline-block}
.qrline{display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:20px;align-items:center}
.qrimg{width:150px;height:150px;background:#fff;padding:8px;border:1px solid var(--line);border-radius:12px}
.qrbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
@media(max-width:640px){.qrline{grid-template-columns:1fr}.qrimg{justify-self:start}}
#printArea .poster{width:100%;max-width:150mm;margin:10mm auto 0;text-align:center;color:#15181a}
#printArea .poster .plogo{width:34mm;height:auto;margin:0 auto 8mm;display:block}
#printArea .poster h1{font:800 30pt/1.08 var(--disp);letter-spacing:-.03em;margin:0 0 4mm;text-wrap:balance}
#printArea .poster .pl{font-size:15pt;margin:0 0 10mm;color:#4a5358}
#printArea .poster .pqr{width:90mm;height:90mm;display:block;margin:0 auto 8mm}
#printArea .poster .pc{font-size:15pt;margin:0 0 4mm}
#printArea .poster .pu{font:800 17pt var(--disp);margin:0 0 12mm}
#printArea .poster .ps{font-size:11pt;color:#4a5358;margin:0;border-top:1px solid #c9cfd2;padding-top:5mm}

/* ---------- Adaptatif ---------- */
@media(max-width:1100px){
 .hero-main{max-width:100%}
 .hero-kpis{margin-right:-36px}
 .hero-logo{opacity:.07;width:270px;height:362px;right:-24px;top:-6px}
}
@media(max-width:960px){
 .app{grid-template-columns:72px minmax(0,1fr)}
 .side{padding:20px 11px;align-items:center}
 .brand{padding:0;justify-content:center}
 .brand h1,.brand small,.nav span,.side-note{display:none}
 .nav button{justify-content:center;padding:13px}
 .nav button.active:before{left:-11px}
 .badge{position:absolute;top:4px;right:2px;margin:0}
 .nav .sdot{position:absolute;top:9px;right:9px;margin:0}
 .main{padding:24px 3vw}
 .content{grid-template-columns:1fr}
 .kpis{grid-template-columns:repeat(2,1fr)}
 .kp:nth-child(2){border-right:0}.kp:nth-child(-n+2){border-bottom:1px solid var(--line)}
 .two{grid-template-columns:1fr}
}
@media(max-width:640px){
 .gsearch,.gsearch input{width:100%}
 .hero{padding:24px 20px 0}
 .hero-kpis{grid-template-columns:repeat(2,1fr);margin:24px -20px 0}
 .hk{padding:14px 20px}
 .hk:nth-child(2){border-right:0}.hk:nth-child(-n+2){border-bottom:1px solid #23272a}
 .hk .stat-number{font-size:28px}
 .form-grid,.grid3,.doc-grid{grid-template-columns:1fr}
 .field.full{grid-column:auto}
 .filters select{max-width:none;flex:1}
 .hide-sm{display:none}
 .modal{padding:18px}
 .stepper .step span{display:none}
 .bar{grid-template-columns:96px 1fr 24px}
 .table th,.table td{padding:11px 12px}
 .bench{grid-template-columns:1fr}
 .topbar h2{font-size:27px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.adm-back{position:fixed;inset:0;background:rgba(11,12,13,.7);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:40;padding:16px;display:flex;align-items:center;justify-content:center}
.adm{width:min(420px,100%);background:var(--panel);border-radius:18px;padding:26px;box-shadow:0 30px 80px rgba(0,0,0,.45);animation:pop .16s ease-out}
.adm-lock{width:44px;height:44px;border-radius:12px;background:var(--amber-t);color:var(--amber-x);display:grid;place-items:center;margin-bottom:12px}
.adm-lock svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.adm h3{margin:0 0 6px;font:800 21px/1.15 var(--disp);letter-spacing:-.03em}
.adm-what{margin:0 0 16px;color:#4a5358;font-size:14px;line-height:1.45}
.adm input[readonly]{background:var(--soft);color:#4a5358}
.adm-err{min-height:18px;margin-top:8px;color:var(--red-x);font-size:13px;font-weight:600}
.adm .form-actions{margin-top:14px}
</style>
</head>

/* ============ Utilitaires ============ */
const KEY='hmaig_db_v2';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nl=s=>esc(s).replace(/\n/g,'<br>');
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>iso(new Date());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d)};
const addMonths=(s,n)=>{if(!s)return'';const[y,m,d]=s.split('-').map(Number);const t=new Date(y,m-1+n,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(d,last));return iso(t)};
const diff=(a,b)=>Math.round((pd(b)-pd(a))/864e5);
const fmtD=s=>s?pd(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'}).replace('.',''):'—';
const fmtDL=s=>s?pd(s).toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}):'—';
const eur=n=>Number(n||0).toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const sum=(a,f)=>a.reduce((x,y)=>x+f(y),0);
const opt=(v,l,sel)=>`<option value="${esc(v)}"${String(v)===String(sel)?' selected':''}>${esc(l)}</option>`;
const opts=(arr,sel)=>arr.map(x=>opt(x,x,sel)).join('');
const initials=n=>String(n||'?').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();

/* ============ Notifications calculées ============ */
function alerts(){
 const A=[],t=today();
 const add=a=>{if(!db.dismissed[a.key])A.push(a)};
 db.repairs.forEach(r=>{
  const nm=cl(r.clientId).name+' — '+dv(r.deviceId).model,b={rid:r.id,kind:r.status};
  const n=diff(r.statusSince||r.deposit,t);
  if(r.status==='recu'&&n<=3)add(Object.assign({key:'recu:'+r.id,lv:'info',ic:'↓',title:'Appareil reçu',text:nm+' · accusé de réception à envoyer'},b,{kind:'recu'}));
  if(r.status==='devis')add(Object.assign({key:'devis:'+r.id+r.statusSince,lv:n>=3?'warn':'info',ic:'€',title:'Devis à valider',text:nm+' · en attente depuis '+n+' j'},b));
  if(r.status==='piece'){const ok=db.orders.some(o=>o.repairId===r.id&&o.status==='Reçue');
   add(Object.assign({key:'piece:'+r.id+r.statusSince+(ok?'ok':''),lv:ok?'ok':'warn',ic:ok?'✓':'▦',title:ok?'Pièce reçue':'Pièce manquante',text:nm+(ok?' · la réparation peut reprendre':' · '+(r.partsNeeded||'pièce en attente'))},b))}
  if(r.status==='pret')add(Object.assign({key:'pret:'+r.id+r.statusSince,lv:n>=7?'warn':'ok',ic:'✓',title:n>=7?'Appareil non récupéré':'Réparation terminée',text:nm+(n>=7?' · prêt depuis '+n+' j':' · client à prévenir')},b));
  if(r.status==='refuse')add(Object.assign({key:'refuse:'+r.id+r.statusSince,lv:'info',ic:'↩',title:'Devis refusé',text:nm+" · appareil à restituer"},b));
  if(isOpen(r)&&r.promised&&r.promised<t)add({key:'retard:'+r.id+r.promised,lv:'danger',ic:'!',title:'Retard',text:nm+' · promis le '+fmtDL(r.promised)+' ('+diff(r.promised,t)+' j de retard)',kind:'retard',rid:r.id});
 });
 db.parts.forEach(p=>{if(p.qty<=p.threshold&&!db.orders.some(o=>o.partId===p.id&&o.status!=='Reçue'))add({key:'stock:'+p.id+':'+p.qty,lv:p.qty<=0?'danger':'warn',ic:'▦',title:p.qty<=0?'Rupture de stock':'Stock bas',text:p.name+' · '+p.qty+' en stock (seuil '+p.threshold+')',kind:'stock',pid:p.id})});
 db.sav.forEach(s=>{const nm=cl(s.storeId).name+' — '+s.device;
  if(s.status==='Reçu')add({key:'sav:'+s.id,lv:'info',ic:'⇄',title:'SAV à qualifier',text:nm+' · reçu le '+fmtDL(s.received),kind:'sav',sid:s.id});
  if(s.status==='Prêt à retourner')add({key:'savpret:'+s.id,lv:'ok',ic:'✓',title:'SAV prêt à retourner',text:nm+' · prévenir le magasin',kind:'savpret',sid:s.id})});
 INBOX.list.filter(d=>d.status==='nouvelle').forEach(d=>add({key:'dem:'+d.id,lv:'info',ic:'✉',title:d.kind==='sav'?'Nouvelle demande SAV en ligne':'Nouvelle demande en ligne',text:(d.kind==='sav'?d.store:d.name)+' — '+d.model+' · reçue '+dWhen(d.created_at),kind:'demande',did:d.id}));
 const o={danger:0,warn:1,ok:2,info:3};
 return A.sort((a,b)=>o[a.lv]-o[b.lv]);
}
function alertHTML(a){
 return `<div class="al ${a.lv}"><div class="ic">${a.ic}</div><div class="tx"><b>${esc(a.title)}</b><span>${esc(a.text)}</span><div class="ac"><button class="secondary small" onclick="openAlert('${a.key}')">Ouvrir</button>${a.kind!=='stock'&&a.kind!=='demande'?`<button class="secondary small" onclick="msgByKey('${a.key}')">✉ Message</button>`:''}<button class="secondary small" onclick="dismissAlert('${a.key}')">✓ Traité</button></div></div></div>`;
}
function openAlert(key){const a=alerts().find(x=>x.key===key);if(!a)return;if(a.rid)openRepair(a.rid);else if(a.sid)openSav(a.sid);else if(a.pid)openPartForm(a.pid);else if(a.did)openDemande(a.did)}

function vAlerts(){

 const f=inp.files[0];if(!f)return;const fr=new FileReader();
 fr.onload=()=>{try{const d=JSON.parse(fr.result);if(!d||!Array.isArray(d.repairs)||!Array.isArray(d.clients))throw 0;
  if(!confirm('Remplacer toutes les données actuelles par cette sauvegarde ('+d.repairs.length+' dossiers, '+d.clients.length+' clients) ?'+syncWarn()))return;

 fr.readAsText(f);
}

/* ---------- Accès à la base ---------- */
function sbStore(s){sbSess=s;try{s?localStorage.setItem(SBK,JSON.stringify(s)):localStorage.removeItem(SBK)}catch(e){}}
function sbFromToken(d){return{access_token:d.access_token,refresh_token:d.refresh_token,expires_at:Math.floor(Date.now()/1000)+(d.expires_in||3600),email:(d.user&&d.user.email)||''}}
async function sbRefresh(){
 if(!sbSess||!sbSess.refresh_token)return false;
 try{
  const r=await fetch(SB.url+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:sbSess.refresh_token})});
  if(!r.ok){sbStore(null);return false}
  const d=await r.json();d.user=d.user||{email:sbSess.email};sbStore(sbFromToken(d));return true;
 }catch(e){return false}
}
async function sbReq(method,path,body,opt){
 opt=opt||{};
 const run=async tok=>{
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
  try{return await fetch(SB.url+path,{method,signal:ctl.signal,headers:Object.assign({apikey:SB.key,Authorization:'Bearer '+(tok||SB.key),'Content-Type':'application/json'},opt.headers||{}),body:body===undefined?undefined:JSON.stringify(body)})}
  finally{clearTimeout(to)}
 };
 let r=await run(sbSess&&sbSess.access_token);
 if(r.status===401&&sbSess&&await sbRefresh())r=await run(sbSess.access_token);
 return r;
}
async function inboxLogin(e){
 e.preventDefault();
 const em=$('#sb_email').value.trim(),pw=$('#sb_pass').value,err=$('#sb_err'),b=$('#sb_btn');
 err.textContent='';b.disabled=true;b.textContent='Connexion…';
 try{
  const r=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){err.textContent=(r.status===400||r.status===401)?'E-mail ou mot de passe incorrect.':'Connexion impossible pour le moment.';b.disabled=false;b.textContent='Se connecter';return}
  d.user=d.user||{email:em};sbStore(sbFromToken(d));
  await inboxLoad();pubFlush();render();toast('Connecté : demandes et données synchronisées en ligne');cloudSync({force:true});
 }catch(x){err.textContent='Connexion impossible : vérifiez votre accès internet.';b.disabled=false;b.textContent='Se connecter'}
}

 sbStore(null);INBOX.list=[];INBOX.loaded=false;INBOX.err='';inboxCount();cloudSet('off');render();
}
async function inboxLoad(){
 if(!SB.on||!sbSess)return;
 INBOX.loading=true;
 try{
  const r=await sbReq('GET','/rest/v1/demandes?select='+INBOX_COLS+'&order=created_at.desc&limit=500');
  if(r.status===401){INBOX.err=sbSess?'':'Session expirée : reconnectez-vous.'}

/* Devis joint à l'e-mail : à l'étape « Devis envoyé », la base reçoit une copie du devis ;

function devisFor(r){
 const L=repDocs(r).filter(d=>d.kind==='devis');
 for(const s of ['Envoyé','Brouillon','Accepté']){const D=L.find(d=>d.status===s);if(D){ensureLabor(D);return D}}
 return null;
}
function devisPayload(D){
 const s=db.settings,c=cl(D.clientId),r=db.repairs.find(x=>x.id===D.repairId),d=r?dv(r.deviceId):{model:'',serial:''};
 const cut=(v,n)=>String(v==null?'':v).slice(0,n);
 return{
  number:cut(D.number,40),date:D.date||'',validUntil:D.validUntil||'',rate:Number(D.rate)||0,exempt:!!D.exempt,note:cut(D.note,1000),
  lines:(D.lines||[]).slice(0,60).map(l=>({label:cut(l.label,200),qty:Number(l.qty)||0,price:Number(l.price)||0})),
  client:{name:cut(c.name,120),address:cut(c.address,300),phone:cut(c.phone,40),email:cut(c.email,160)},
  device:{model:cut(d.model,120),serial:cut(d.serial,60)},ref:cut(r&&r.ref,40),issue:cut(r&&r.issue,300),
  co:{name:cut(s.company,120),address:cut(s.address,300),phone:cut(s.phone,40),email:cut(s.email,160),siret:cut(s.siret,30)},
  warranty:Number(s.warrantyMonths)||0,legal:cut(s.legal,800),
  sent_at:new Date().toISOString() /* change à chaque envoi : c'est ce qui déclenche aussi un renvoi */
 };
}
const demandeMail=o=>{const d=o&&o.demandeId&&INBOX.list.find(x=>x.id===o.demandeId);return d&&d.email?String(d.email).trim():''};
async function pubSync(o,type){
 if(!SB.on||!o||!o.demandeId)return;
 const pub=(type==='sav'?PUB_SAV:PUB_REP)[o.status];if(!pub)return;
 if(!sbSess){o.pubDirty=true;save();return}
 const f={public_status:pub};let D=null;
 if(pub==='devis'&&type!=='sav'){D=devisFor(o);f.devis=D?devisPayload(D):null}
 const ok=await inboxPatch(o.demandeId,f,true);
 if(ok){
  const was=o.pubDirty;if(was)delete o.pubDirty;
  const to=D&&demandeMail(o);
  if(to){if(D.status==='Brouillon')D.status='Envoyé';log(o,'Devis '+D.number+' envoyé par e-mail à '+to)}
  if(was||to){save();if(to)refreshModal()}
 }
 else{o.pubDirty=true;save();toast('Statut non transmis au suivi client : il sera renvoyé à la prochaine connexion')}
}
/* Bouton « Envoyer par e-mail » d'un devis (premier envoi ou renvoi) */
async function sendDevisMail(id){
 const D=db.docs.find(x=>x.id===id);if(!D||D.kind!=='devis')return;
 const r=db.repairs.find(x=>x.id===D.repairId);
 if(!SB.on||!r||!r.demandeId){toast("Ce dossier ne vient pas d'une demande en ligne : envoyez le devis vous-même (imprimer / PDF).");return}
 if(!sbSess){toast('Connectez-vous à la boîte de demandes (menu Demandes) pour envoyer le devis.');return}
 const to=demandeMail(r);
 if(!to){toast("Le client n'a pas laissé d'adresse e-mail dans sa demande.");return}
 ensureLabor(D);
 if(!confirm('Envoyer le devis '+D.number+' par e-mail à '+to+' ?\n\nLe client le reçoit en PDF.'+(laborZero(D)?"\n\n⚠ La main d'œuvre est à 0 € sur ce devis.":'')))return;
 if(['recu','diag'].includes(r.status)){ /* même chemin que le changement d'étape : un seul e-mail, avec le PDF */
  if(D.status==='Brouillon'||D.status==='Refusé')D.status='Envoyé';
  setStatus(r.id,'devis',true);return;
 }
 const ok=await inboxPatch(r.demandeId,{devis:devisPayload(D)},true);
 if(!ok){toast("Envoi impossible pour le moment (pas de connexion ?).");return}
 if(D.status==='Brouillon')D.status='Envoyé';
 log(r,'Devis '+D.number+' renvoyé par e-mail à '+to);save();refreshModal();toast('Devis envoyé à '+to);
}

/* ============ Synchronisation en ligne de toutes les données de l'atelier ============ */
/* Un seul document en ligne (table atelier_donnees), lu et écrit avec le compte atelier.
   - chaque modification est envoyée ~2 s plus tard ;
   - si un autre appareil a écrit entre-temps, les deux versions sont FUSIONNÉES fiche par fiche
     (comparaison avec la dernière version commune) : rien n'est perdu ;
   - hors connexion, l'outil continue de fonctionner et envoie tout au retour du réseau. */
const CLK='hmaig_cloud_v1';
const SYNC_COLS=['clients','devices','repairs','sav','docs','parts','orders'];
const SYNC_ALL=SYNC_COLS.concat('technicians');
const CLOUD={on:SB.on,dev:'',ver:0,base:null,dirty:false,at:0,state:SB.on?'off':'none',err:'',busy:false,again:false,applying:false,timer:null,rev:0,deferred:0,remote:null,hist:null,histErr:'',histBusy:false};
try{const s=JSON.parse(localStorage.getItem(CLK)||'null');if(s){CLOUD.dev=s.dev||'';CLOUD.ver=s.ver||0;CLOUD.base=s.base||null;CLOUD.dirty=!!s.dirty;CLOUD.at=s.at||0}}catch(e){}
function cloudStore(){try{localStorage.setItem(CLK,JSON.stringify({dev:CLOUD.dev,ver:CLOUD.ver,base:CLOUD.base,dirty:CLOUD.dirty,at:CLOUD.at}))}catch(e){}}
if(!CLOUD.dev){CLOUD.dev=(/Mobi|Android|iPhone|iPad/i.test(navigator.userAgent||'')?'Téléphone ':'Ordinateur ')+Math.random().toString(36).slice(2,6);cloudStore()}
const cloudLinked=()=>CLOUD.ver>0&&!!CLOUD.base;

/* ---------- Comparaison : empreintes ---------- */
function canon(v){
 if(v===null||typeof v!=='object')return JSON.stringify(v);
 if(Array.isArray(v))return'['+v.map(canon).join(',')+']';
 return'{'+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+':'+canon(v[k])).join(',')+'}';
}
function h53(s){let a=0xdeadbeef,b=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return(4294967296*(2097151&b)+(a>>>0)).toString(36)}
const hsh=v=>h53(canon(v));
const isRec=x=>x&&typeof x==='object';
function colsOf(d){const o={};SYNC_COLS.forEach(k=>{o[k]=Array.isArray(d[k])?d[k].filter(x=>isRec(x)&&x.id):[]});const t=(d.settings||{}).technicians;o.technicians=Array.isArray(t)?t.filter(x=>isRec(x)&&x.id):[];return o}
/* Empreinte de chaque fiche telle qu'elle était à la dernière synchronisation (sert de point de comparaison). */
function baseOf(d){
 const b={c:{},s:{},d:{}},C=colsOf(d);
 SYNC_ALL.forEach(n=>{b.c[n]={};C[n].forEach(x=>{b.c[n][x.id]=hsh(x)})});
 const S=d.settings||{};Object.keys(S).forEach(k=>{if(k!=='technicians')b.s[k]=hsh(S[k])});
 Object.keys(d.dismissed||{}).forEach(k=>{b.d[k]=hsh(d.dismissed[k])});
 return b;
}
const isEmptyDoc=d=>!d||SYNC_COLS.every(k=>!(Array.isArray(d[k])&&d[k].length));
function cloudNormalise(d){
 const o=Object.assign(blank(),d);o.settings=Object.assign(blank().settings,d.settings||{});
 o.counters=o.counters||{};o.dismissed=o.dismissed||{};
 SYNC_COLS.forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
 if(!Array.isArray(o.settings.technicians))o.settings.technicians=blank().settings.technicians;
 return o;
}

/* ---------- Fusion à trois voies ---------- */
/* L = version locale, R = version en ligne, B = empreinte de la dernière version commune.
   Une fiche modifiée d'un seul côté est reprise telle quelle ; modifiée des deux côtés, la version
   de cet appareil l'emporte ; supprimée d'un côté mais modifiée de l'autre, elle est conservée. */
function pick(L,R,B){
 const hl=L===undefined?undefined:hsh(L),hr=R===undefined?undefined:hsh(R);
 if(hl===hr)return L;
 if(B===undefined)return L!==undefined?L:R;
 const lc=hl!==B,rc=hr!==B;
 if(!lc)return R;
 if(!rc)return L;
 return L!==undefined?L:R;
}
function cloudMerge(L,R,B){
 B=B||{c:{},s:{},d:{}};
 const LC=colsOf(L),RC=colsOf(R),out=Object.assign({},L),cols={};
 SYNC_ALL.forEach(n=>{
  const la=LC[n],ra=RC[n],bm=(B.c&&B.c[n])||{};
  const lm=new Map(la.map(x=>[x.id,x])),rm=new Map(ra.map(x=>[x.id,x])),got=new Map();
  new Set([...lm.keys(),...rm.keys(),...Object.keys(bm)]).forEach(id=>{const v=pick(lm.get(id),rm.get(id),bm[id]);if(v!==undefined)got.set(id,v)});
  const mid=[];ra.forEach(x=>{if(got.has(x.id)){mid.push(got.get(x.id));got.delete(x.id)}});
  /* fiches présentes seulement ici : en tête si elles l'étaient dans la liste locale, sinon à la fin */
  const sh=la.findIndex(x=>rm.has(x.id)),head=[],tail=[];
  la.forEach((x,i)=>{if(got.has(x.id))(sh>=0&&i<sh?head:tail).push(got.get(x.id))});
  cols[n]=head.concat(mid,tail);
 });
 SYNC_COLS.forEach(n=>{out[n]=cols[n]});
 const S=Object.assign({},L.settings||{}),RS=R.settings||{},Bs=B.s||{};
 new Set([...Object.keys(S),...Object.keys(RS),...Object.keys(Bs)]).forEach(k=>{
  if(k==='technicians')return;
  const v=pick(S[k],RS[k],Bs[k]);if(v===undefined)delete S[k];else S[k]=v;
 });
 S.technicians=cols.technicians;out.settings=S;
 const K=Object.assign({},L.counters||{});
 Object.keys(R.counters||{}).forEach(k=>{K[k]=Math.max(Number(K[k]||0),Number(R.counters[k]||0))});
 out.counters=K;
 const Ld=L.dismissed||{},Rd=R.dismissed||{},Bd=B.d||{},D={};
 new Set([...Object.keys(Ld),...Object.keys(Rd),...Object.keys(Bd)]).forEach(k=>{const v=pick(Ld[k],Rd[k],Bd[k]);if(v!==undefined)D[k]=v});
 out.dismissed=D;
 out.demo=!!(L.demo&&R.demo);
 return out;
}

/* ---------- États affichés ---------- */
const CSTATE={
 none:['Synchronisation indisponible','grey'],
 off:['Non connecté : les données restent seulement sur cet appareil','grey'],
 sync:['Synchronisation en cours…','amber'],
 ok:['À jour','green'],
 wait:['Modifications en attente d\'envoi','amber'],
 offline:['Pas de connexion : tout est gardé ici et sera envoyé dès le retour du réseau','amber'],
 err:['Synchronisation impossible pour le moment','red'],
 forbid:['Ce compte n\'est pas autorisé à enregistrer les données de l\'atelier','red'],
 choice:['Un choix est nécessaire pour finir la mise en route','red'],
 vide:['Rien n\'est encore enregistré en ligne','amber']
};
function cloudLabel(){
 const s=CLOUD.state,x=CSTATE[s]||CSTATE.err;let t=x[0];
 if(s==='ok'&&CLOUD.at)t='À jour · dernière synchronisation à '+new Date(CLOUD.at).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
 if(s==='err'&&CLOUD.err)t=CLOUD.err;
 return[t,x[1]];
}
const cloudDot=()=>cloudLabel()[1];
function cloudSet(s,err){
 const ch=CLOUD.state!==s||CLOUD.err!==(err||'');
 CLOUD.state=s;CLOUD.err=err||'';
 if(ch)cloudUI();
}
function cloudUI(){
 if(typeof renderNav==='function')renderNav();
 const a=document.activeElement;
 if(view==='sync'&&!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)&&$('#view').contains(a))){$('#view').innerHTML=VIEWS.sync.fn()}
}
const cloudModalOpen=()=>$('#modalBack').classList.contains('open');
function cloudBusy(){
 const modal=cloudModalOpen(),a=document.activeElement,typing=!!(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName||'')&&a.id!=='gs'&&$('#view').contains(a));
 if(!modal&&!typing)return false;
 if(!modal&&CLOUD.deferred&&Date.now()-CLOUD.deferred>20000)return false;
 return true;
}
function cloudDefer(){
 CLOUD.deferred=CLOUD.deferred||Date.now();
 cloudSet('wait');
 clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>cloudSync(),4000);
}
function cloudKick(){if(CLOUD.on&&sbSess&&(CLOUD.deferred||CLOUD.dirty)){clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>cloudSync(),400)}}

/* ---------- Accès à la base ---------- */
const cErr=(code,msg)=>{const e=new Error(msg||code);e.code=code;return e};
async function cloudGet(full){
 const r=await sbReq('GET','/rest/v1/atelier_donnees?select=version,modifie_le,modifie_par'+(full?',contenu':'')+'&id=eq.1');
 if(r.status===401)throw cErr('auth');
 if(!r.ok)throw cErr('http','Lecture impossible (code '+r.status+')');
 const a=await r.json(),x=Array.isArray(a)&&a[0];
 return x?{ver:Number(x.version),at:x.modifie_le,by:x.modifie_par||'',doc:x.contenu||null}:{ver:0,at:null,by:'',doc:null};
}
async function cloudPush(expected,force){
 const snap=JSON.parse(JSON.stringify(db)),base=baseOf(snap),rev=CLOUD.rev;
 const r=await sbReq('POST','/rest/v1/rpc/enregistrer_donnees',{p_contenu:snap,p_version_attendue:expected,p_appareil:CLOUD.dev,p_sauvegarde:!!force});
 if(r.status===401)throw cErr('auth');
 if(r.status===403)throw cErr('forbid');
 if(!r.ok)throw cErr('http','Envoi impossible (code '+r.status+')');
 const j=await r.json();
 if(!j||!j.ok)return{ok:false,ver:j&&j.version};
 CLOUD.ver=Number(j.version);CLOUD.base=base;CLOUD.at=Date.now();CLOUD.dirty=CLOUD.rev!==rev;CLOUD.deferred=0;cloudStore();
 if(CLOUD.dirty)CLOUD.again=true;
 return{ok:true};
}
function cloudApply(doc){CLOUD.applying=true;try{db=cloudNormalise(doc);save()}finally{CLOUD.applying=false}}
function cloudAdopt(doc,ver){
 cloudApply(doc);
 CLOUD.ver=ver;CLOUD.base=baseOf(db);CLOUD.dirty=false;CLOUD.at=Date.now();CLOUD.deferred=0;cloudStore();
 render();
}

/* ---------- Déroulement d'une synchronisation ---------- */
function cloudChanged(){
 if(!CLOUD.on||CLOUD.applying)return;
 CLOUD.rev++;
 if(cloudLinked()){CLOUD.dirty=true;cloudStore()}
 if(!sbSess)return;
 if((CLOUD.state==='ok'||CLOUD.state==='err'||CLOUD.state==='offline')&&cloudLinked())cloudSet('wait');
 clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>cloudSync(),1800);
}
async function cloudSync(opts){
 opts=opts||{};
 if(!CLOUD.on)return;
 if(!sbSess){if(CLOUD.state!=='off')cloudSet('off');return}
 if(CLOUD.busy){CLOUD.again=true;return}
 if(CLOUD.state==='choice'&&!opts.force)return;
 CLOUD.busy=true;CLOUD.again=false;
 if(CLOUD.state!=='wait'||opts.force)cloudSet('sync');
 try{await cloudRun(opts)}catch(e){cloudFail(e)}
 CLOUD.busy=false;
 if(CLOUD.again){CLOUD.again=false;clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>cloudSync(),300)}
}
function cloudFail(e){
 const c=e&&e.code;
 if(!sbSess){cloudSet('off');toast('Session expirée : reconnectez-vous pour reprendre la synchronisation');return}
 if(c==='auth'){cloudSet('err','Accès refusé : déconnectez-vous puis reconnectez-vous.');return}
 if(c==='forbid'){cloudSet('forbid');return}
 if(c==='http'){cloudSet('err',e.message);return}
 cloudSet('offline');
 clearTimeout(CLOUD.timer);CLOUD.timer=setTimeout(()=>cloudSync(),20000);
}
async function cloudRun(opts){
 for(let n=0;n<6;n++){
  const m=await cloudGet(false);
  if(!sbSess)return cloudSet('off');
  if(!cloudLinked()){if(await cloudFirst(m,opts)!=='retry')return;continue}
  if(m.ver===0){CLOUD.ver=0;CLOUD.base=null;cloudStore();continue} /* le document en ligne a disparu : on repart de zéro */
  if(m.ver===CLOUD.ver){
   if(!CLOUD.dirty)return cloudSet('ok');
   const p=await cloudPush(CLOUD.ver,false);
   if(p.ok)return cloudSet(CLOUD.dirty?'wait':'ok');
   continue;
  }
  /* une version plus récente existe en ligne */
  if(cloudBusy())return cloudDefer();
  const R=await cloudGet(true);
  if(!R.doc)continue;
  if(!CLOUD.dirty){cloudAdopt(R.doc,R.ver);return cloudSet('ok')}
  cloudApply(cloudMerge(db,R.doc,CLOUD.base));
  const p=await cloudPush(R.ver,false);
  if(p.ok){render();return cloudSet(CLOUD.dirty?'wait':'ok')}
 }
 cloudSet('err','Synchronisation interrompue : trop de modifications simultanées, nouvel essai dans une minute.');
}
/* Première liaison de cet appareil avec les données en ligne */
async function cloudFirst(m,opts){
 opts=opts||{};
 let R=null;
 if(m.ver>0){R=await cloudGet(true);if(!R.doc)return'retry'}
 const remoteEmpty=!R||isEmptyDoc(R.doc),localEmpty=!!db.demo||isEmptyDoc(db);
 if(localEmpty){
  if(remoteEmpty){
   /* l'exemple n'est jamais envoyé tout seul ; sur demande explicite seulement (au cas où de vraies données y seraient mêlées) */
   const send=db.demo&&!isEmptyDoc(db)&&(opts.sendDemo||(opts.force&&(opts.sendDemo=confirm("Cet appareil contient des données d'exemple (ou un mélange avec vos vraies données) et rien n'est encore enregistré en ligne.\n\nOK : envoyer quand même les données de cet appareil en ligne.\nAnnuler : ne rien envoyer."))));
   if(!send){cloudSet('vide');return'done'}
  }else{
   if(cloudBusy()){cloudDefer();return'done'}
   cloudAdopt(R.doc,R.ver);cloudSet('ok');
   toast('Vos données ont été récupérées depuis la synchronisation en ligne');
   return'done';
  }
 }
 if(remoteEmpty){
  const p=await cloudPush(m.ver,false);
  if(!p.ok)return'retry';
  cloudSet('ok');toast('Vos données sont maintenant enregistrées en ligne');
  return'done';
 }
 if(cloudBusy()){cloudDefer();return'done'}
 CLOUD.remote=R;cloudSet('choice');cloudChoiceModal();
 return'done';
}
const syncCnt=d=>`${(d.repairs||[]).length} dossier${(d.repairs||[]).length>1?'s':''}, ${(d.clients||[]).length} client${(d.clients||[]).length>1?'s':''}, ${(d.parts||[]).length} pièce${(d.parts||[]).length>1?'s':''}, ${(d.docs||[]).length} devis/facture${(d.docs||[]).length>1?'s':''}`;
function cloudChoiceModal(){
 const R=CLOUD.remote;if(!R)return;
 modal(()=>`${mh('Synchronisation','Des données existent déjà en ligne')}
  <p style="margin:0 0 12px">Cet appareil et la version en ligne contiennent chacun des données. Que voulez-vous faire ?</p>
  <div class="notice" style="margin:0 0 6px"><b>Cet appareil :</b> ${syncCnt(db)}</div>
  <div class="notice" style="margin:0 0 16px"><b>En ligne :</b> ${syncCnt(R.doc)}${R.at?' · modifié le '+esc(dWhen(R.at)):''}</div>
  <div style="display:grid;gap:10px">
   <button class="primary" style="text-align:left;padding:13px 15px" onclick="cloudResolve('merge')"><b>Fusionner les deux (conseillé)</b><br><span style="font-weight:400;font-size:12.5px">Les fiches des deux côtés sont réunies : rien n'est perdu.</span></button>
   <button class="secondary" style="text-align:left;padding:13px 15px" onclick="cloudResolve('local')"><b>Garder les données de cet appareil</b><br><span style="font-weight:400;font-size:12.5px">Remplace la version en ligne (une copie de celle-ci est conservée dans les sauvegardes).</span></button>
   <button class="secondary" style="text-align:left;padding:13px 15px" onclick="cloudResolve('remote')"><b>Prendre les données en ligne</b><br><span style="font-weight:400;font-size:12.5px">Remplace les données de cet appareil (une sauvegarde de cet appareil est d'abord téléchargée).</span></button>
  </div>
  <div class="form-actions"><button class="secondary" onclick="closeModal()">Décider plus tard</button></div>`,()=>closeModal(),true);
}
async function cloudResolve(ch){
 const R=CLOUD.remote;if(!R||CLOUD.busy)return;
 CLOUD.busy=true;cloudSet('sync');
 let again=false;
 try{
  if(ch==='remote'){
   if(!db.demo&&!isEmptyDoc(db))exportJSON();
   cloudAdopt(R.doc,R.ver);
  }else{
   if(ch==='merge')cloudApply(cloudMerge(db,R.doc,null));
   const p=await cloudPush(R.ver,ch==='local');
   if(!p.ok)again=true;
  }
  if(!again){CLOUD.remote=null;cloudSet('ok')}
 }catch(e){cloudFail(e)}
 CLOUD.busy=false;
 closeModal();
 if(again){CLOUD.state='sync';cloudSync({force:true});return}
 if(CLOUD.state==='ok')toast(ch==='remote'?'Données en ligne récupérées':ch==='local'?'Les données de cet appareil sont en ligne':'Les deux versions ont été fusionnées');
}

/* ---------- Sauvegardes automatiques ---------- */
async function syncLoadHistory(){
 if(!sbSess||CLOUD.histBusy)return;
 CLOUD.histBusy=true;CLOUD.histErr='';cloudUI();
 try{
  const r=await sbReq('GET','/rest/v1/atelier_historique?select=id,version,cree_le,appareil,resume&order=cree_le.desc&limit=30');
  if(!r.ok)CLOUD.histErr='Lecture impossible (code '+r.status+').';
  else CLOUD.hist=await r.json();
 }catch(e){CLOUD.histErr='Pas de connexion.'}
 CLOUD.histBusy=false;cloudUI();
}
async function syncRestore(id){
 if(!sbSess||CLOUD.busy)return;
 if(!confirm('Revenir à cette version ?\n\nLes données actuelles seront remplacées sur tous vos appareils. Une copie de l\'état actuel est conservée dans les sauvegardes.'))return;
 CLOUD.busy=true;cloudSet('sync');
 try{
  const r=await sbReq('GET','/rest/v1/atelier_historique?select=contenu&id=eq.'+encodeURIComponent(id));
  const a=r.ok?await r.json():[];
  if(!a[0]||!a[0].contenu){CLOUD.busy=false;cloudSet('err','Cette sauvegarde est introuvable.');return}
  cloudApply(a[0].contenu);
  let ok=false;
  for(let n=0;n<4&&!ok;n++){const m=await cloudGet(false);ok=(await cloudPush(m.ver,true)).ok}
  if(ok){cloudSet('ok');render();toast('Version restaurée et synchronisée')}else cloudSet('err','Restauration non enregistrée : réessayez.');
 }catch(e){cloudFail(e)}
 CLOUD.busy=false;
}

/* ============ Verrou « compte admin » ============ */
/* Les actions sensibles (suppressions, stock, paramètres) demandent le mot de passe du compte
   administrateur. Le mot de passe est vérifié par Supabase Auth ; la session ouverte pour la
   vérification est fermée aussitôt : rien n'est mémorisé, le mot de passe est redemandé à chaque action.
   Ce compte n'a AUCUN droit sur la base des demandes : il ne sert qu'à confirmer l'identité.
   Sans base configurée (version hors ligne), le verrou est inactif. */
const ADMIN_MAIL='';
const ADM={open:false,fails:0,lockUntil:0};
const admOn=()=>!!(SB.on&&ADMIN_MAIL);

async function admVerify(pw){
 const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),15000);
 try{
  const r=await fetch(SB.url+'/auth/v1/token?grant_type=password',{method:'POST',signal:ctl.signal,headers:{apikey:SB.key,'Content-Type':'application/json'},body:JSON.stringify({email:ADMIN_MAIL,password:pw})});
  const d=await r.json().catch(()=>({}));
  if(r.ok&&d.access_token){
   const ok=String((d.user&&d.user.email)||'').toLowerCase()===ADMIN_MAIL.toLowerCase();
   /* on ferme tout de suite la session de vérification (elle n'est jamais conservée) */
   fetch(SB.url+'/auth/v1/logout',{method:'POST',headers:{apikey:SB.key,Authorization:'Bearer '+d.access_token}}).catch(()=>{});
   return ok?'ok':'bad';
  }
  if(r.status===400||r.status===401||r.status===422)return 'bad';
  if(r.status===429)return 'rate';
  return 'net';
 }catch(e){return 'net'}
 finally{clearTimeout(to)}
}

function admAsk(what){
 return new Promise(resolve=>{
  if(ADM.open){resolve(false);return}
  ADM.open=true;
  const prev=document.activeElement;
  const back=document.createElement('div');back.className='adm-back';
  back.innerHTML=`<form class="adm" role="dialog" aria-modal="true" aria-labelledby="admT" autocomplete="on">
   <div class="adm-lock" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></div>
   <h3 id="admT">Action réservée à l'administrateur</h3>
   <p class="adm-what">${esc(what)}</p>
   <div class="field"><label for="admUser">Compte administrateur</label><input id="admUser" type="email" value="${esc(ADMIN_MAIL)}" readonly autocomplete="username"></div>
   <div class="field" style="margin-top:10px"><label for="admPw">Mot de passe administrateur</label><input id="admPw" type="password" required autocomplete="current-password"></div>
   <div class="adm-err" id="admErr" role="alert"></div>
   <div class="form-actions"><button type="button" class="secondary" id="admNo">Annuler</button><button class="primary" id="admOk" type="submit">Valider</button></div>
  </form>`;
  document.body.appendChild(back);
  const f=back.querySelector('form'),pw=back.querySelector('#admPw'),err=back.querySelector('#admErr'),ok=back.querySelector('#admOk');
  const done=v=>{document.removeEventListener('keydown',onKey,true);back.remove();ADM.open=false;try{prev&&prev.focus&&prev.focus()}catch(e){}resolve(v)};
  const onKey=e=>{if(e.key==='Escape'){e.preventDefault();e.stopPropagation();done(false)}};
  document.addEventListener('keydown',onKey,true);
  back.querySelector('#admNo').onclick=()=>done(false);
  f.onsubmit=async e=>{
   e.preventDefault();
   const wait=ADM.lockUntil-Date.now();
   if(wait>0){err.textContent='Trop d\'essais. Patientez '+Math.ceil(wait/1000)+' s.';return}
   if(!pw.value)return;
   err.textContent='';ok.disabled=true;ok.textContent='Vérification…';
   const res=await admVerify(pw.value);
   if(res==='ok'){ADM.fails=0;done(true);return}
   ok.disabled=false;ok.textContent='Valider';
   if(res==='bad'){
    ADM.fails++;
    if(ADM.fails>=5){ADM.fails=0;ADM.lockUntil=Date.now()+60000;err.textContent='Trop d\'essais. Patientez 60 s.'}
    else err.textContent='Mot de passe incorrect.';
    pw.value='';pw.focus();
   }else if(res==='rate')err.textContent='Trop de tentatives : réessayez dans quelques minutes.';
   else err.textContent='Connexion impossible : ce verrou demande internet.';
  };
  setTimeout(()=>pw.focus(),30);
 });
}

/* Enveloppe une fonction existante : la fenêtre admin s'ouvre d'abord, l'action ne part qu'après validation.
   need(...args) : renvoie false si l'action ne demande pas l'admin (ou sera de toute façon refusée).
   deny(...args) : remet l'écran dans son état si l'admin est refusé (champ modifié, liste déroulante…). */
function adminGuard(name,label,need,deny){
 const orig=window[name];
 if(typeof orig!=='function')throw new Error('adminGuard : fonction inconnue '+name);
 window[name]=function(...a){
  if(a[0]&&typeof a[0].preventDefault==='function')a[0].preventDefault();
  if(!admOn()||(need&&!need(...a)))return orig.apply(this,a);
  const what=typeof label==='function'?label(...a):label;
  return admAsk(what).then(ok=>{
   if(ok)return orig.apply(this,a);
   if(deny)deny(...a);
  });
 };
}

function devUnderWarranty(did){
 const t=today(),d=dv(did);
 if(db.repairs.some(r=>r.deviceId===did&&r.returnDate&&warrEnd(r)>=t))return true;
 if(d&&d.serial&&db.sav.some(s=>s.storeId===d.clientId&&s.serial&&s.serial===d.serial&&savWarr(s).k==='sous'))return true;
 return false;
}

}
function createDocFor(kind,rid,toRepair){
 const r=db.repairs.find(x=>x.id===rid);if(!r)return;let from='';
 if(kind==='facture'){const q=repDocs(r).find(d=>d.kind==='devis'&&d.status==='Accepté');if(q)from=q.id;
  if(repDocs(r).some(d=>d.kind==='facture')&&!confirm('Une facture existe déjà pour ce dossier. En créer une autre ?'))return}
 newDoc(kind,rid,from,toRepair?()=>openRepair(rid):null);
}
function newDoc(kind,rid,from,back){
 const r=db.repairs.find(x=>x.id===rid);if(!r)return;let lines=[];const F=from&&db.docs.find(x=>x.id===from);
 if(F){lines=JSON.parse(JSON.stringify(F.lines));lines.forEach(l=>{delete l.labor})} /* la ligne obligatoire ne concerne que les devis */
 else{
  const rate=db.settings.tvaExempt?0:Number(db.settings.tvaRate||0),base=r.estimate?+(Number(r.estimate)/(1+rate/100)).toFixed(2):0;
  r.parts.forEach(p=>{const P=pt(p.partId);if(P)lines.push({label:P.name,qty:p.qty,price:Number(P.sell)||0})});
  const ph=sum(lines,l=>l.qty*l.price);
  lines.unshift({label:LABOR+' — '+(r.issue||'réparation'),qty:1,price:Math.max(0,+(base-ph).toFixed(2)),labor:true});
 }
 const D=mkDoc(db,kind,r,lines,{fromDoc:from||''});db.docs.unshift(D);log(r,(kind==='devis'?'Devis ':'Facture ')+D.number+' créé');save();toast((kind==='devis'?'Devis ':'Facture ')+D.number+' créé');openDoc(D.id,back);
}
/* Main d'œuvre : une ligne obligatoire sur chaque devis (jamais supprimable, toujours en tête) */
const LABOR="Main d'œuvre";
const isLaborLabel=s=>/^main d.?(œ|oe)uvre/i.test(String(s||'').trim());
function ensureLabor(D){
 if(!D||D.kind!=='devis'||!['Brouillon','Envoyé'].includes(D.status)||D.lines.some(l=>l.labor))return false;
 const m=D.lines.find(l=>isLaborLabel(l.label));
 if(m)m.labor=true;else D.lines.unshift({label:LABOR,qty:1,price:0,labor:true});
 save();return true;
}
const laborZero=D=>{const L=D&&D.kind==='devis'&&D.lines.find(l=>l.labor);return !!L&&!(Number(L.qty)*Number(L.price)>0)};
const laborWarn=D=>laborZero(D)?`<div class="notice warn" style="margin:10px 0 0">⚠ La main d'œuvre est à 0 € : pensez à indiquer son prix avant d'envoyer le devis.</div>`:'';

const lineRow=(id,l,i)=>`<tr><td><input value="${esc(l.label)}" onchange="setLine('${id}',${i},'label',this.value)" aria-label="Désignation"></td><td class="w60"><input type="number" min="0" step="1" value="${l.qty}" onchange="setLine('${id}',${i},'qty',this.value)" aria-label="Quantité"></td><td class="w90"><input type="number" min="0" step="0.01" value="${l.price}" onchange="setLine('${id}',${i},'price',this.value)" aria-label="Prix unitaire HT"></td><td class="amount right" id="lt${i}">${eur(l.qty*l.price)}</td><td>${l.labor?`<span class="muted" title="Ligne obligatoire sur chaque devis" style="cursor:help">🔒</span>`:`<button class="icon-btn" title="Supprimer la ligne" onclick="rmLine('${id}',${i})">×</button>`}</td></tr>`;
function totalsHTML(D){const T=totals(D);return `<div><span>Total HT</span><b>${eur(T.ht)}</b></div>${D.exempt?'':`<div><span>TVA ${D.rate} %</span><b>${eur(T.tva)}</b></div>`}<div class="big"><span>Total TTC</span><b>${eur(T.ttc)}</b></div>`}
function docEditHTML(id){
 const D=db.docs.find(x=>x.id===id);if(!D)return mh('','Document introuvable');
 const r=db.repairs.find(x=>x.id===D.repairId),c=cl(D.clientId),isD=D.kind==='devis',hasInv=isD&&db.docs.some(x=>x.fromDoc===id);
 return `${mh((isD?'Devis':'Facture')+' · '+D.number,c.name+(r?' — '+dv(r.deviceId).model:''))}
 <div class="grid3">${fi('docs',id,'date','Date','date',D.date)}${isD?fi('docs',id,'validUntil',"Valable jusqu'au",'date',D.validUntil):`<div class="field"><label>Mode de paiement</label><select onchange="upd('docs','${id}','method',this.value)"><option value="">—</option>${opts(METHODS,D.method)}</select></div>`}
 <div class="field"><label>Statut</label><select onchange="setDocStatus('${id}',this.value)">${DOCST[D.kind].map(s=>opt(s,s,D.status)).join('')}</select></div></div>
 <div class="sec"><h4>Lignes (prix unitaires HT)</h4><div class="table-wrap"><table class="tbl-in"><thead><tr><th>Désignation</th><th>Qté</th><th>PU HT</th><th class="right">Total HT</th><th></th></tr></thead><tbody>${D.lines.map((l,i)=>lineRow(id,l,i)).join('')}</tbody></table></div>
  <button class="secondary small" style="margin-top:8px" onclick="addLine('${id}')">+ Ligne</button><div class="totals" id="docTot">${totalsHTML(D)}</div><div id="docWarn">${laborWarn(D)}</div></div>
 <div class="sec">${ft('docs',id,'note','Note visible sur le document (optionnel)',D.note)}</div>
 <div class="form-actions"><button class="danger" style="margin-right:auto" onclick="delDoc('${id}')">Supprimer</button>${isD&&D.status==='Accepté'&&!hasInv?`<button class="secondary" onclick="toInvoice('${id}')">→ Convertir en facture</button>`:''}<button class="secondary" onclick="previewDoc('${id}')">🖶 Aperçu / Imprimer</button>${isD&&SB.on&&r&&demandeMail(r)?`<button class="secondary" onclick="sendDevisMail('${id}')">✉ Envoyer par e-mail</button>`:''}<button class="primary" onclick="backModal()">Fermer</button></div>`;
}
function setLine(id,i,f,v){
 const D=db.docs.find(x=>x.id===id),L=D.lines[i];
 if(f==='label'&&L.labor&&!String(v).trim()){L.label=LABOR;save();refreshModal();return} /* la ligne obligatoire garde toujours un nom */
 L[f]=f==='label'?v:Math.max(0,Number(v)||0);save();$('#lt'+i).textContent=eur(L.qty*L.price);$('#docTot').innerHTML=totalsHTML(D);$('#docWarn').innerHTML=laborWarn(D);
}
function addLine(id){db.docs.find(x=>x.id===id).lines.push({label:'',qty:1,price:0});save();refreshModal()}
function rmLine(id,i){const D=db.docs.find(x=>x.id===id);if(D.lines[i]&&D.lines[i].labor){toast("La main d'œuvre est obligatoire sur chaque devis : modifiez son prix plutôt que de la supprimer.");return}D.lines.splice(i,1);save();refreshModal()}
function setDocStatus(id,s){
 const D=db.docs.find(x=>x.id===id),r=db.repairs.find(x=>x.id===D.repairId);
 if(s==='Envoyé'&&D.kind==='devis'){ensureLabor(D);if(laborZero(D)&&!confirm("La main d'œuvre est à 0 € sur le devis "+D.number+".\n\nLe marquer « Envoyé » quand même ?")){refreshModal();return}}
 D.status=s;
 if(D.kind==='devis'&&r){
  if(s==='Envoyé'&&['recu','diag'].includes(r.status))setStatus(r.id,'devis',true);
  if(s==='Accepté'&&['recu','diag','devis'].includes(r.status))setStatus(r.id,'valide',true);
  if(s==='Refusé'&&['recu','diag','devis'].includes(r.status))setStatus(r.id,'refuse',true);
 }
 if(D.kind==='facture'){
  if(s==='Payée'){D.paidAt=D.paidAt||today();if(r){r.payment='Réglé';log(r,'Facture '+D.number+' réglée')}}
  else{D.paidAt='';if(r&&r.payment==='Réglé'){r.payment='Non réglé'}}
 }
 save();refreshModal();
}

 return `<div class="doc"><div class="doc-head"><div>${coBlock()}</div><div class="doc-ti"><h1>${isD?'DEVIS':'FACTURE'}</h1><div>N° ${esc(D.number)}</div><div>Date : ${fmtDL(D.date)}</div>${isD&&D.validUntil?`<div>Valable jusqu'au ${fmtDL(D.validUntil)}</div>`:''}</div></div>
 <div class="doc-grid"><div><b>Client</b><br>${esc(c.name)}${c.address?'<br>'+nl(c.address):''}${c.phone?'<br>'+esc(c.phone):''}${c.email?'<br>'+esc(c.email):''}</div><div><b>Appareil</b><br>${d?esc(d.model)+(d.serial?'<br>N° série / IMEI : '+esc(d.serial):''):'—'}${r?'<br>Dossier '+esc(r.ref):''}${r&&r.issue?'<br>Panne : '+esc(r.issue):''}</div></div>
 <table class="doc-tab"><thead><tr><th>Désignation</th><th>Qté</th><th>PU HT</th><th>Total HT</th></tr></thead><tbody>${D.lines.map(l=>`<tr><td>${esc(l.label)}</td><td>${l.qty}</td><td>${eur(l.price)}</td><td>${eur(l.qty*l.price)}</td></tr>`).join('')}</tbody></table>
 <div class="doc-tot"><div><span>Total HT</span><b>${eur(T.ht)}</b></div>${D.exempt?'':`<div><span>TVA ${D.rate} %</span><b>${eur(T.tva)}</b></div>`}<div class="big"><span>Total TTC</span><b>${eur(T.ttc)}</b></div></div>
 ${D.exempt?'<p class="doc-sm">TVA non applicable, art. 293 B du CGI.</p>':''}${D.note?`<p class="doc-sm">${nl(D.note)}</p>`:''}
 ${isD?'<div class="doc-sign">Bon pour accord — date et signature du client :</div>':(D.status==='Payée'?`<p class="doc-sm"><b>Acquittée</b> le ${fmtDL(D.paidAt)}${D.method?' · '+esc(D.method):''}</p>`:'<p class="doc-sm">Paiement à réception de la facture.</p>')}
 <p class="doc-foot">Garantie réparation : ${s.warrantyMonths} mois à compter de la restitution, limitée à la panne réparée et aux pièces remplacées.${s.legal?' '+esc(s.legal):''}</p></div>`;

function createRepairFromSav(id){
 const s=db.sav.find(x=>x.id===id);
 let d=db.devices.find(x=>x.clientId===s.storeId&&s.serial&&x.serial===s.serial);
 if(!d){d={id:uid(),clientId:s.storeId,type:'Autre',model:s.device,serial:s.serial,notes:''};db.devices.push(d)}
 const r=mkRepair(db,{clientId:s.storeId,deviceId:d.id,source:'magasin',savId:s.id,issue:s.issue,deposit:s.received,history:[{d:today(),t:'Dossier créé depuis '+s.ref}]});
 db.repairs.unshift(r);s.repairId=r.id;log(s,'Dossier de réparation '+r.ref+' créé');if(s.status==='Reçu')s.status='En analyse';save();openRepair(r.id,()=>openSav(id));
}
function delSav(id){if(!confirm('Supprimer cette demande SAV ?'))return;db.repairs.forEach(r=>{if(r.savId===id)r.savId=''});db.sav=db.sav.filter(s=>s.id!==id);save();closeModal();toast('Demande supprimée')}

/* ============ Pièces & commandes ============ */
function openPartForm(id,back){
 const p=id?pt(id):null,g=(k,d)=>p?p[k]:d;
 modal(()=>`${mh('Stock',p?p.name:'Nouvelle pièce')}<form onsubmit="savePartForm(event,'${id||''}')"><div class="form-grid">
  <div class="field full"><label>Désignation *</label><input id="pf_name" required value="${esc(g('name',''))}"></div>
  <div class="field"><label>Référence</label><input id="pf_ref" value="${esc(g('ref',''))}"></div><div class="field"><label>Catégorie</label><select id="pf_cat">${opts(PCATS,g('cat','Autre'))}</select></div>
  <div class="field"><label>Quantité en stock</label><input id="pf_qty" type="number" min="0" value="${esc(g('qty',0))}"></div><div class="field"><label>Seuil d'alerte</label><input id="pf_thr" type="number" min="0" value="${esc(g('threshold',1))}"></div>
  <div class="field"><label>Prix d'achat HT (€)</label><input id="pf_buy" type="number" min="0" step="0.01" value="${esc(g('buy',''))}"></div><div class="field"><label>Prix de vente HT (€)</label><input id="pf_sell" type="number" min="0" step="0.01" value="${esc(g('sell',''))}"></div>
  <div class="field"><label>Fournisseur</label><input id="pf_sup" value="${esc(g('supplier',''))}"></div><div class="field"><label>Emplacement</label><input id="pf_loc" value="${esc(g('loc',''))}" placeholder="ex. tiroir A3"></div></div>
  <div class="form-actions">${p?`<button type="button" class="danger" style="margin-right:auto" onclick="delPart('${id}')">Supprimer</button>`:''}<button type="button" class="secondary" onclick="backModal()">Annuler</button><button class="primary" type="submit">Enregistrer</button></div></form>`,back,true);
 $('#pf_name').focus();
}
function savePartForm(e,id){
 e.preventDefault();const v=i=>$('#'+i).value.trim();
 const o={name:v('pf_name'),ref:v('pf_ref'),cat:v('pf_cat'),qty:Math.max(0,parseInt(v('pf_qty'))||0),threshold:Math.max(0,parseInt(v('pf_thr'))||0),buy:Number(v('pf_buy'))||0,sell:Number(v('pf_sell'))||0,supplier:v('pf_sup'),loc:v('pf_loc')};
 if(id)Object.assign(pt(id),o);else db.parts.push(Object.assign({id:uid()},o));
 save();toast('Pièce enregistrée');closeModal();
}
function delPart(id){const used=db.repairs.some(r=>r.parts.some(x=>x.partId===id));if(!confirm('Supprimer cette pièce du stock ?'+(used?"\nElle apparaît dans l'historique de dossiers.":'')))return;db.parts=db.parts.filter(p=>p.id!==id);db.orders=db.orders.filter(o=>o.partId!==id);save();closeModal()}
function adjStock(id,n){const p=pt(id);p.qty=Math.max(0,p.qty+n);save();render()}
function openOrderForm(partId,repairId,back){
 if(!db.parts.length){toast("Ajoutez d'abord une pièce au stock");return}
 const p0=pt(partId)||db.parts[0],sug=Math.max(1,p0.threshold*2-p0.qty);
 modal(()=>`${mh('Commande fournisseur','Nouvelle commande')}<form onsubmit="saveOrderForm(event,'${back?'1':''}')"><div class="form-grid">
  <div class="field full"><label>Pièce</label><select id="o_part" onchange="$('#o_sup').value=(pt(this.value)||{}).supplier||''">${db.parts.map(p=>opt(p.id,p.name+' ('+p.qty+' en stock)',p0.id)).join('')}</select></div>
  <div class="field"><label>Quantité</label><input id="o_qty" type="number" min="1" value="${sug}"></div><div class="field"><label>Fournisseur</label><input id="o_sup" value="${esc(p0.supplier)}"></div>
  <div class="field full"><label>Dossier concerné (optionnel)</label><select id="o_rep"><option value="">—</option>${db.repairs.filter(isOpen).map(r=>opt(r.id,r.ref+' — '+cl(r.clientId).name+' · '+dv(r.deviceId).model,repairId)).join('')}</select></div></div>
  <div class="form-actions"><button type="button" class="secondary" onclick="backModal()">Annuler</button><button class="primary" type="submit">Créer la commande</button></div></form>`,back,true);
}
function saveOrderForm(e,hasBack){
 e.preventDefault();const rid=$('#o_rep').value,pid=$('#o_part').value;
 db.orders.push({id:uid(),partId:pid,qty:Math.max(1,parseInt($('#o_qty').value)||1),supplier:$('#o_sup').value.trim(),date:today(),status:'À commander',repairId:rid,received:false});
 const r=db.repairs.find(x=>x.id===rid);if(r)log(r,'Pièce commandée : '+(pt(pid)||{}).name);
 if(r&&r.status!=='piece'&&isOpen(r)&&confirm('Passer le dossier '+r.ref+' en « Attente pièce » ?'))setStatus(r.id,'piece',true);
 save();toast('Commande créée');if(hasBack)backModal();else closeModal();
}
function setOrder(id,s){
 const o=db.orders.find(x=>x.id===id),p=pt(o.partId),r=db.repairs.find(x=>x.id===o.repairId);o.status=s;
 if(s==='Reçue'&&!o.received){o.received=true;o.receivedAt=today();if(p)p.qty+=o.qty;if(r){log(r,'Pièce reçue : '+(p?p.name:''));if(r.status==='piece')toast('Pièce reçue — le dossier '+r.ref+' peut reprendre')}else toast('Stock mis à jour : +'+o.qty)}
 save();render();
}
function delOrder(id){if(!confirm('Supprimer cette commande ?'))return;db.orders=db.orders.filter(o=>o.id!==id);save();render()}
function autoOrder(){
 let n=0;db.parts.forEach(p=>{if(p.qty<=p.threshold&&!db.orders.some(o=>o.partId===p.id&&o.status!=='Reçue')){db.orders.push({id:uid(),partId:p.id,qty:Math.max(1,p.threshold*2-p.qty),supplier:p.supplier,date:today(),status:'À commander',repairId:'',received:false});n++}});
 save();toast(n?n+' commande'+(n>1?'s':'')+' créée'+(n>1?'s':'')+' (à passer chez le fournisseur)':'Aucune pièce sous le seuil sans commande en cours');render();
}

/* Import de pièces (.csv) : une ligne par pièce. Une référence déjà au stock n'est jamais dupliquée ;
   seuls ses prix (achat / vente) sont mis à jour si le fichier en donne ; quantité et autres champs ne bougent pas. */
const nkey=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z0-9]/g,'');
function parseCSV(txt){
 txt=txt.replace(/^﻿/,'');
 const first=txt.split(/\r?\n/)[0]||'',d=[';','\t',','].map(c=>[c,first.split(c).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const rows=[];let row=[],f='',q=false;
 for(let i=0;i<txt.length;i++){const c=txt[i];
  if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
  else if(c==='"')q=true;
  else if(c===d){row.push(f);f=''}
  else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[]}
  else f+=c}
 if(f!==''||row.length){row.push(f);rows.push(row)}
 return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const PCOLS={ref:['reference','ref','sku','code'],name:['designation','nom','article','produit','libelle','description'],cat:['categorie','famille','type'],qty:['quantite','qte','stock','qty'],thr:['seuil','seuilalerte','minimum','min'],buy:['achat','prixachat','prixachatht','achatht'],sell:['vente','prixvente','prixventeht','venteht'],sup:['fournisseur'],loc:['emplacement','lieu','rangement']};
function importPartsFromText(txt){
 const rows=parseCSV(txt);if(rows.length<2)return{err:'Fichier vide : il faut une ligne de titres puis une ligne par pièce.'};
 const heads=rows[0].map(nkey),col={};
 Object.keys(PCOLS).forEach(k=>{const i=heads.findIndex(h=>PCOLS[k].includes(h));if(i>=0)col[k]=i});
 if(col.name===undefined)return{err:'Colonne « Désignation » introuvable (première ligne du fichier).'};
 const g=(r,k)=>col[k]===undefined?'':String(r[col[k]]||'').trim(),num=v=>{const n=parseFloat(String(v||'').replace(/\s/g,'').replace('€','').replace(',','.'));return isFinite(n)?n:0};
 let added=0,known=0,updated=0,skipped=0;
 rows.slice(1).forEach(r=>{
  const name=g(r,'name'),ref=g(r,'ref');if(!name){skipped++;return}
  const ex=ref&&db.parts.find(p=>p.ref&&nkey(p.ref)===nkey(ref));
  if(ex){
   let ch=false;
   ['buy','sell'].forEach(k=>{if(col[k]!==undefined&&g(r,k)!==''){const v=num(g(r,k));if(Math.abs((ex[k]||0)-v)>0.0049){ex[k]=v;ch=true}}});
   if(ch)updated++;else known++;
   return}
  const cv=nkey(g(r,'cat')),cat=PCATS.find(c=>nkey(c)===cv)||(cv.length>=4?PCATS.find(c=>nkey(c).startsWith(cv.slice(0,5))):'')||'Autre';
  db.parts.push({id:uid(),name,ref,cat,qty:Math.max(0,Math.round(num(g(r,'qty')))),threshold:col.thr===undefined?1:Math.max(0,Math.round(num(g(r,'thr')))),buy:num(g(r,'buy')),sell:num(g(r,'sell')),supplier:g(r,'sup'),loc:g(r,'loc')});added++;
 });
 return{added,known,updated,skipped};
}
function importPartsCSV(inp){
 const f=inp.files&&inp.files[0];if(!f)return;
 const fr=new FileReader();
 fr.onload=()=>{
  try{
   let txt;try{txt=new TextDecoder('utf-8',{fatal:true}).decode(fr.result)}catch(e){txt=new TextDecoder('windows-1252').decode(fr.result)}
   const r=importPartsFromText(txt);
   if(r.err){toast(r.err)}
   else{save();render();toast(r.added+' pièce'+(r.added>1?'s':'')+' ajoutée'+(r.added>1?'s':'')+(r.updated?' · '+r.updated+' pièce'+(r.updated>1?'s':'')+' : prix mis à jour':'')+(r.known?' · '+r.known+' déjà au stock (inchangée'+(r.known>1?'s':'')+')':'')+(r.skipped?' · '+r.skipped+' ligne'+(r.skipped>1?'s':'')+' ignorée'+(r.skipped>1?'s':''):''))}
  }catch(e){toast('Fichier illisible : utilisez un fichier .csv')}
  inp.value='';
 };
 fr.readAsArrayBuffer(f);
}

/* ============ Messages (préparés, jamais envoyés automatiquement) ============ */
function msgByKey(key){const a=alerts().find(x=>x.key===key);if(!a)return;if(a.sid)openMsg(a.kind,null,a.sid);else openMsg(a.kind,a.rid)}
function notifyRepair(id){const r=db.repairs.find(x=>x.id===id);openMsg(({recu:'recu',diag:'recu',devis:'devis',piece:'piece',pret:'pret',refuse:'refuse'})[r.status]||'statut',id,null,()=>openRepair(id))}
function msgData(kind,rid,sid){
 const co=db.settings.company,ph=db.settings.phone,sig='\n\n'+co+(ph?' · '+ph:'');
 if(sid){const s=db.sav.find(x=>x.id===sid),c=cl(s.storeId),what=s.device+(s.serial?' (n° '+s.serial+')':'');
  const body=kind==='savpret'?`Bonjour,\n\nle SAV ${s.ref} (${what}) est traité et prêt à être retourné.${s.exchangeNote?'\n'+s.exchangeNote:''}`:`Bonjour,\n\nnous avons bien reçu votre demande SAV ${s.ref} pour ${what}. Nous la qualifions et revenons vers vous rapidement.`;
  return{to:c,subject:'SAV '+s.ref+' — '+co,body:body+sig}}
 const r=db.repairs.find(x=>x.id===rid),c=cl(r.clientId),d=dv(r.deviceId),hi=c.kind==='magasin'?'Bonjour,':'Bonjour '+c.name.split(' ')[0]+',';
 const q=repDocs(r).find(x=>x.kind==='devis'&&['Envoyé','Brouillon'].includes(x.status)),m={
  recu:`nous avons bien reçu votre ${d.model} (dossier ${r.ref}). Nous réalisons le diagnostic et revenons vers vous rapidement.`,
  devis:`votre devis${q?' n° '+q.number+' ('+eur(totals(q).ttc)+' TTC)':''} pour la réparation de votre ${d.model} (dossier ${r.ref}) est prêt. Merci de nous indiquer si vous le validez afin que nous lancions l'intervention.`,
  piece:`la réparation de votre ${d.model} (dossier ${r.ref}) est en attente d'une pièce${r.partsNeeded?' ('+r.partsNeeded+')':''}. Nous vous tiendrons informé(e) dès sa réception.`,
  retard:`la réparation de votre ${d.model} (dossier ${r.ref}) prend un peu plus de temps que prévu. Nous revenons vers vous très vite avec une nouvelle date.`,
  pret:`votre ${d.model} est réparé et prêt à être récupéré (dossier ${r.ref}). Votre réparation est garantie ${db.settings.warrantyMonths} mois à compter de la restitution.`,
  refuse:`suite au refus du devis, votre ${d.model} (dossier ${r.ref}) est disponible pour restitution.`,
  statut:`point sur votre dossier ${r.ref} (${d.model}) : statut « ${stL(r.status)} ».`};
 return{to:c,subject:'Votre '+d.model+' — dossier '+r.ref,body:hi+'\n\n'+(m[kind]||m.statut)+sig};
}
function openMsg(kind,rid,sid,back){
 curMsg=Object.assign(msgData(kind,rid,sid),{kind,rid,sid});
 modal(()=>`${mh('Message à envoyer',curMsg.to.name)}<div class="field"><label>Texte (modifiable)</label><textarea id="msgBody" style="min-height:200px">${esc(curMsg.body)}</textarea></div>
 <div class="notice">Rien n'est envoyé automatiquement : copiez le texte ou ouvrez votre application SMS / e-mail.</div>
 <div class="form-actions"><button class="secondary" onclick="msgCopy()">Copier</button><button class="secondary" onclick="msgSms()">SMS</button><button class="secondary" onclick="msgMail()">E-mail</button><button class="primary" onclick="msgSent()">✓ Marquer comme envoyé</button></div>`,back,true);
}
function msgCopy(){const t=$('#msgBody');t.select();try{navigator.clipboard.writeText(t.value).then(()=>toast('Texte copié'),()=>{document.execCommand('copy');toast('Texte copié')})}catch(e){document.execCommand('copy');toast('Texte copié')}}
function msgSms(){const p=(curMsg.to.phone||'').replace(/\s/g,'');if(!p){toast('Aucun téléphone sur la fiche — copiez le texte');return}location.href='sms:'+p+'?body='+encodeURIComponent($('#msgBody').value)}
function msgMail(){if(!curMsg.to.email){toast('Aucun e-mail sur la fiche — copiez le texte');return}location.href='mailto:'+encodeURIComponent(curMsg.to.email).replace('%40','@')+'?subject='+encodeURIComponent(curMsg.subject)+'&body='+encodeURIComponent($('#msgBody').value)}
function msgSent(){
 const m=curMsg;
 alerts().filter(a=>((m.rid&&a.rid===m.rid)||(m.sid&&a.sid===m.sid))&&a.kind===m.kind).forEach(a=>{db.dismissed[a.key]=today()});
 const o=m.sid?db.sav.find(x=>x.id===m.sid):db.repairs.find(x=>x.id===m.rid);if(o)log(o,'Message envoyé à '+m.to.name+' ('+m.kind+')');
 save();toast('Notification marquée comme envoyée');backModal();
}

/* ============ Démarrage ============ */
render();
</script>
</body></html>
